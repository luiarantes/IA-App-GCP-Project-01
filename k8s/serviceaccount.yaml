# KSA vinculada à GSA buscacep-workload via Workload Identity.
# O binding KSA → GSA é criado pelo Terraform no repo de infra
# (module "buscacep_workload_identity"). Esta anotação é o lado
# Kubernetes da federação — sem ela o token GCP não é emitido.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buscacep-ksa
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: buscacep-workload@ia-infra-gcp-project-01.iam.gserviceaccount.com
