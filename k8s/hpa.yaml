# HPA só para a API — o worker não tem sentido escalar horizontalmente
# porque um único consumidor é suficiente para este volume de mensagens.
# maxReplicas=3 mantém o custo controlado no ambiente de teste.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: buscacep-api
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: buscacep-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
