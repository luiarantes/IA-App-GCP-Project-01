apiVersion: apps/v1
kind: Deployment
metadata:
  name: buscacep-api
  namespace: default
  labels:
    app: buscacep-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buscacep-api
  template:
    metadata:
      labels:
        app: buscacep-api
    spec:
      serviceAccountName: buscacep-ksa
      containers:
        - name: buscacep-api
          # IMAGE_PLACEHOLDER é substituído pelo SHA do commit no workflow de deploy.
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
          env:
            - name: PUBSUB_PROJECT_ID
              value: "ia-infra-gcp-project-01"
            - name: PUBSUB_TOPIC_ID
              value: "cep-consultado"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
